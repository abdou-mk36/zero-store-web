            height: auto;

        }

            bottom: 15px;
            left: 15px;
            right: 15px;
            z-index: 999;

            justify-content: center;

            height: 56px;
            border: none;
            border-radius: 14px;

            color: #fff;
            font-family: "Cairo", sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);

            opacity: 0;

            pointer-events: none;
        }

            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 15px;

        .landing-error {

        }

        .landing-error h2 {
            font-size: 20px;
            color: #0B0B0B;
            margin-bottom: 10px;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAow12ZmlBvMGubA6807hMOBIW4QA1ZFYE",
  authDomain: "zero-store-dz.firebaseapp.com",
  projectId: "zero-store-dz",
  storageBucket: "zero-store-dz.firebasestorage.app",
  messagingSenderId: "152683195719",
  appId: "1:152683195719:web:c3d73ef8a9d6e546a2f062"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const slug = new URLSearchParams(location.search).get('slug');

async function initLanding() {
    if (!slug) { showError('الرابط غير صالح'); return; }
    try {
        const q = query(collection(db, 'landings'), where('slug', '==', slug));
        const snap = await getDocs(q);
        if (snap.empty) { showError('الصفحة غير موجودة'); return; }

        const landingData = snap.docs[0].data();
        const productSnap = await getDoc(doc(db, 'products', landingData.productId));
        if (!productSnap.exists()) { showError('المنتج غير موجود'); return; }

        renderLanding(landingData, productSnap.data(), landingData.productId);
    } catch (err) {
        console.error(err);
        showError('حدث خطأ في التحميل');
    }
}

function renderLanding(landing, product, productId) {
    const content = document.getElementById('landingContent');
    content.innerHTML = '';

    landing.blocks.forEach(block => {
        if (block.type === 'image') {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'landing-image';
            imgDiv.innerHTML = `<img src="${block.url}" alt="${product.name}" loading="lazy">`;
            content.appendChild(imgDiv);
        } else if (block.type === 'form') {
            const formDiv = document.createElement('div');
            formDiv.className = 'landing-form-wrapper';
            formDiv.innerHTML = buildOrderForm(product, productId);
            content.appendChild(formDiv);
        }
    });

    document.getElementById('loading').style.display = 'none';
    content.style.display = 'block';
    document.title = landing.name + ' — Zero Store';
    initFormLogic(product, productId);
    observeFormVisibility();
}

function buildOrderForm(product, productId) {
    const quantities = product.quantities && product.quantities.length > 0
        ? product.quantities : [{ value: 1, price: product.price, badge: '' }];

    return `

            <p class="form-subtitle">أدخل معلوماتك وسنتواصل معك قريباً</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="full-name">الاسم الكامل</label>
                    <input type="text" id="full-name" placeholder="مثال: أحمد علي">
                </div>
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="07 75 45 09 63" inputmode="tel">
                    <small id="phoneError" style="display:none;color:#E74C3C;font-family:Cairo,sans-serif;font-size:12px;font-weight:600;margin-top:6px;"></small>
                </div>
            </div>

            <div class="form-group">
                <label for="wilaya">الولاية</label>
                <select id="wilaya" required>
                    <option value="" disabled selected>اختر ولايتك</option>
                    ${generateWilayaOptions()}
                </select>
            </div>

            <div class="form-group">
                <label>نوع التوصيل</label>
                <div class="delivery-text-options">
                    <label class="delivery-text-option">
                        <input type="radio" name="deliveryType" value="home" checked>
                        <span class="radio-circle"></span>
                        <span>🏠 توصيل للمنزل</span>
                    </label>
                    <label class="delivery-text-option">
                        <input type="radio" name="deliveryType" value="office">
                        <span class="radio-circle"></span>
                        <span>🏢 توصيل للمكتب</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">البلدية / العنوان</label>
                <input type="text" id="address" placeholder="مثال: حي 5 جويلية، عمارة 12">
            </div>

            <div class="form-group">
                <label>الكمية</label>
                <div class="quantity-options">
                    ${quantities.map((q, i) => `
                        <label class="qty-option">
                            <input type="radio" name="quantity" value="${q.value}" data-price="${q.price}" ${i === 0 ? 'checked' : ''}>
                            <div class="qty-content">
                                ${q.badge ? `<span class="qty-badge">${q.badge}</span>` : ''}
                                <span class="qty-number">${q.value}</span>
                                <span class="qty-price">${q.price.toLocaleString('ar-DZ')} دج</span>

            </div>

            <div class="delivery-price-box">

            <button type="submit" class="confirm-order-btn">تأكيد الطلب</button>

        "21|سكيكدة","22|سيدي بلعباس","23|عنابة","24|قالمة","25|قسنطينة","26|المدية","27|مستغانم","28|المسيلة","29|معسكر","30|ورقلة",
        "31|وهران","32|البيض","33|إليزي","34|برج بوعريريج","35|بومرداس","36|الطارف","37|تندوف","38|تيسمسيلت","39|الوادي","40|خنشلة",

        "51|أولاد جلال","52|بني عباس","53|إن صالح","54|إن قزام","55|تقرت","56|جانت","57|المغير","58|المنيعة","59|أفلو","60|بريكة",
        "61|القنطرة","62|بئر العاتر","63|العريشة","64|قصر الشلالة","65|عين وسارة","66|مسعد","67|قصر البخاري","68|بوسعادة","69|الأبيض سيدي الشيخ"
    ];
    return wilayas.map(w => {

function initFormLogic(product, productId) {
    window.currentProductName = product.name;
    window.currentProductId = productId;

    const form = document.getElementById('landingOrderForm');
    if (!form) return;

    const wilayaSelect = document.getElementById('wilaya');
    const summaryDelivery = document.getElementById('summaryDelivery');
    const summaryTotal = document.getElementById('summaryTotal');
    const phoneInput = document.getElementById('phone');
    const phoneError = document.getElementById('phoneError');

    const NO_OFFICE_WILAYAS = ["33","37","50","54","56","59","60","61","62","63","64","65","66","67","68","69"];

    if (phoneInput && phoneError) {
        phoneInput.addEventListener('input', () => {
            phoneError.style.display = 'none';
            phoneInput.classList.remove('error');
        });
    }

    function updateSummary() {
        const qtySelected = form.querySelector('input[name="quantity"]:checked');
        const productPrice = qtySelected ? parseInt(qtySelected.dataset.price, 10) : product.price;

        const deliveryTypeEl = form.querySelector('input[name="deliveryType"]:checked');
        const deliveryType = deliveryTypeEl ? deliveryTypeEl.value : 'home';

        const wilayaCode = wilayaSelect.value;
        let deliveryPrice = 0;

        if (wilayaCode) {
            if (deliveryType === 'office') {
                deliveryPrice = DELIVERY_OFFICE[wilayaCode] || 0;
            } else {
                deliveryPrice = DELIVERY_HOME[wilayaCode] || 0;
            }
        }

        const total = productPrice + deliveryPrice;

        if (summaryDelivery) {
            if (wilayaCode) {
                summaryDelivery.textContent = deliveryPrice.toLocaleString('ar-DZ') + ' دج';
                summaryDelivery.style.color = '#00A878';
            } else {
                summaryDelivery.textContent = 'اختر الولاية';
                summaryDelivery.style.color = '#999';
            }
        }

        if (summaryTotal) {
            summaryTotal.textContent = wilayaCode ? total.toLocaleString('ar-DZ') + ' دج' : '-- دج';
        }
    }

    function checkOffice() {
        const wilayaCode = wilayaSelect.value;
        const officeOption = form.querySelector('input[name="deliveryType"][value="office"]');
        const homeOption = form.querySelector('input[name="deliveryType"][value="home"]');
        if (!officeOption || !homeOption) return;

        const officeLabel = officeOption.closest('.delivery-text-option');

        if (!wilayaCode) {
            if (officeLabel) officeLabel.style.display = '';
            officeOption.checked = true;
            return;
        }

        if (NO_OFFICE_WILAYAS.includes(wilayaCode)) {
            if (officeLabel) officeLabel.style.display = 'none';
            homeOption.checked = true;
        } else {
            if (officeLabel) officeLabel.style.display = '';
            officeOption.checked = true;
        }
    }

    wilayaSelect.addEventListener('change', () => { checkOffice(); updateSummary(); });
    form.querySelectorAll('input[name="quantity"]').forEach(i => i.addEventListener('change', updateSummary));
    form.querySelectorAll('input[name="deliveryType"]').forEach(i => i.addEventListener('change', updateSummary));

    checkOffice();
    updateSummary();

    // ✅ عند Enter → لا يُرسل + ينزل للزر
    function dismissAndScroll() {
        if (document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
        }
        setTimeout(() => {
            const submitBtn = form.querySelector('.confirm-order-btn');
            if (!submitBtn) return;
            const btnRect = submitBtn.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            if (btnRect.bottom > viewportHeight - 100) {
                const scrollAmount = btnRect.bottom - viewportHeight + 40;
                window.scrollBy({ top: scrollAmount, behavior: 'smooth' });
            }
        }, 300);
    }

    form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            dismissAndScroll();
        }
    });

    form.querySelectorAll('.qty-option').forEach(option => {
        option.addEventListener('click', dismissAndScroll);
    });

    form.querySelectorAll('.delivery-text-option').forEach(option => {
        option.addEventListener('click', dismissAndScroll);
    });
    
    // ✅ إعادة تعيين الزر عند الرجوع (bfcache)
    window.addEventListener('pageshow', (e) => {
        if (e.persisted) {
            const submitBtn = form.querySelector('.confirm-order-btn');
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تأكيد الطلب';
                submitBtn.classList.remove('loading');
            }

            // ✅ إخفاء زر "اطلب الآن" إذا كانت الاستمارة في الشاشة
            const orderBtn = document.getElementById('orderBtn');
            if (orderBtn) {
                const rect = form.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                const isVisible = rect.top < viewportHeight * 0.85 && rect.bottom > 0;
                orderBtn.classList.toggle('hide', isVisible);
            }
        }
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('full-name').value.trim();
        const phone = phoneInput.value.trim();
        const wilayaText = wilayaSelect.options[wilayaSelect.selectedIndex].text;
        const wilayaCode = wilayaSelect.value;
        const address = document.getElementById('address').value.trim();

        if (phone.replace(/\D/g, '').length < 10) {
            phoneError.textContent = '❌ يرجى إدخال رقم هاتف صحيح';
            phoneError.style.display = 'block';
            phoneInput.classList.add('error');
            phoneInput.focus();
            return;
        }

        if (!name || !address || !wilayaCode) {
            alert('❌ يرجى تعبئة جميع الحقول');
            return;
        }

        const deliveryType = form.querySelector('input[name="deliveryType"]:checked').value;
        const deliveryLabel = deliveryType === 'home' ? 'المنزل' : 'المكتب';

        const qtySelected = form.querySelector('input[name="quantity"]:checked');
        const quantity = qtySelected ? qtySelected.value : '1';
        const productPrice = qtySelected ? parseInt(qtySelected.dataset.price, 10) : product.price;

        let deliveryPrice = deliveryType === 'office'
            ? (DELIVERY_OFFICE[wilayaCode] || 0)
            : (DELIVERY_HOME[wilayaCode] || 0);
        const total = productPrice + deliveryPrice;

        const submitBtn = form.querySelector('.confirm-order-btn');
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'جارٍ تأكيد طلبك...';
        }

        const params = new URLSearchParams({
            productName: product.name, name, phone, wilaya: wilayaText,
            deliveryType: deliveryLabel, address, quantity,
            productPrice, deliveryPrice, total
        });

        fetch(GOOGLE_SCRIPT_URL + '?' + params.toString(), {
            method: 'GET', mode: 'no-cors', keepalive: true
        }).catch(() => {});

        sendToTelegram(TELEGRAM_CHAT_ORDERS,
            `📦 *طلب جديد — Zero Store*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n\n` +
            `🛍️ *المنتج:* ${product.name}\n\n` +
            `👤 *الاسم:* ${name}\n\n` +
            `📞 *الهاتف:* ${phone}\n\n` +
            `📍 *الولاية:* ${wilayaText}\n\n` +
            `🚚 *نوع التوصيل:* ${deliveryLabel}\n\n` +
            `🔢 *الكمية:* ${quantity}\n\n` +
            `💰 *المنتج:* ${productPrice.toLocaleString('ar-DZ')} دج\n\n` +
            `🚛 *التوصيل:* ${deliveryPrice.toLocaleString('ar-DZ')} دج\n\n` +
            `💵 *الإجمالي:* ${total.toLocaleString('ar-DZ')} دج\n\n` +
            `🏠 *العنوان:* ${address}`
        ).then(() => {
            const pid = window.currentProductId || '';
            window.location.href = 'thank-you.html' + (pid ? '?id=' + pid : '') + (slug ? '&slug=' + slug : '');
        }).catch(() => {
            window.location.href = 'thank-you.html';
        });
    });
}

window.scrollToForm = function() {
    const form = document.getElementById('landingOrderForm');
    if (form) {
        const formTop = form.getBoundingClientRect().top + window.scrollY;
        window.scrollTo({ top: formTop + 100, behavior: 'smooth' });
    }
};

function observeFormVisibility() {
    const form = document.getElementById('landingOrderForm');
    const btn = document.getElementById('orderBtn');
    if (!form || !btn) return;

    function checkFormVisibility() {
        const rect = form.getBoundingClientRect();
        const viewportHeight = window.innerHeight;
        const isVisible = rect.top < viewportHeight * 0.85 && rect.bottom > 0;
        btn.classList.toggle('hide', isVisible);
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            btn.classList.toggle('hide', entry.isIntersecting);
        });
    }, { threshold: 0.15 });

    observer.observe(form);

    window.addEventListener('pageshow', () => {
        setTimeout(checkFormVisibility, 100);
    });

    window.addEventListener('resize', checkFormVisibility);
}

function showError(message) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('orderBtn').style.display = 'none';
    const content = document.getElementById('landingContent');
    content.innerHTML = `
        <div class="landing-error">
            <h2>⚠️ ${message}</h2>
            <p>يرجى التحقق من الرابط</p>
        </div>
    `;
    content.style.display = 'block';
}

initLanding();
</script>
